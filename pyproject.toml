[project]
name = "autolearn"
version = "1.0.4"
description = "Localhost WebUI for course task crawling, solving, and guided interaction."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "scrapling[fetchers]==0.4.15",
  "openai==3.37.0",
  "tiktoken==0.14.0",
  "pycryptodome==4.1.0",
  "Pillow==13.0.0",
  "requests==2.34.2",
]

[project.scripts]
autolearn-webui = "core.webui.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.setuptools.package-data]
"core.webui" = ["static/*"]
